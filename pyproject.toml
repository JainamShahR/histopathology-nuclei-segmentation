[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "histo-nuclei-starter"
version = "0.1.0"
description = "Educational PyTorch U-Net starter for histopathology nuclei segmentation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["torch>=2.1", "numpy>=1.26", "Pillow>=10.0", "opencv-python-headless>=4.8"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
